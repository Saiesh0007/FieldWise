# The Kotlin compiler runs inside the Gradle daemon (no second JVM); this keeps peak memory
# manageable on 8 GB machines.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
